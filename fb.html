<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login UI</title>
     <script
      src="https://kit.fontawesome.com/3ebeef7c5a.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./fb.css" />
  </head>
  <body>
    <div class="container">
      <form action="" class="form-box">
        <h2>Log in to continue</h2>

        <button class="btn facebook"><i class="fa-brands fa-facebook-f"></i> Continue with Facebook</button>
        <button class="btn google"><i class="fa-brands fa-google"></i> Continue with Google</button>

        <p class="or">or</p>

        <input type="email" placeholder="E-mail:" />
        <input type="password" placeholder="Password:" />

        <button class="btn signin">SIGN IN</button>

        <p class="signup">
          Don't have an account?
          <br>
          <a href="#">Sign up here!</a>
          
        </p>
      </form>
    </div>
  </body>
</html>
