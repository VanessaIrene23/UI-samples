<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dashboard.css" />
    <title>Dashboard</title>
  </head>
  <body>
    <div class="container">

      
      <div class="sidebar">
        <div class="profile">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face" />
          <p>Report for</p>
          <h2>Jeremy Robson</h2>
        </div>

        <div class="duration">
          <p>Daily</p>
          <p class="week">Weekly</p>
          <p>Monthly</p>
        </div>
      </div>

      
      <div class="cards">

        <div class=" card work">
          <div class="card-content">
            <div class="card-header">
              <span>Work</span>
              <span>...</span>
            </div>
            <h1>34hrs</h1>
            <p>Last Week - 36hrs</p>
          </div>
        </div>

        <div class=" card play">
          <div class="card-content">
            <div class="card-header">
              <span>Play</span>
              <span>...</span>
            </div>
            <h1>10hrs</h1>
            <p>Last Week - 8hrs</p>
          </div>
        </div>

        <div class="card study">
          <div class="card-content">
            <div class="card-header">
              <span>Study</span>
              <span>...</span>
            </div>
            <h1>4hrs</h1>
            <p>Last Week - 7hrs</p>
          </div>
        </div>

        <div class="card exercise">
          <div class="card-content">
            <div class="card-header">
              <span>Exercise</span>
              <span>...</span>
            </div>
            <h1>4hrs</h1>
            <p>Last Week - 5hrs</p>
          </div>
        </div>

        <div class="card social">
          <div class="card-content">
            <div class="card-header">
              <span>Social</span>
              <span>...</span>
            </div>
            <h1>5hrs</h1>
            <p>Last Week - 10hrs</p>
          </div>
        </div>

        <div class="card selfcare">
          <div class="card-content">
            <div class="card-header">
              <span>Self Care</span>
              <span>...</span>
            </div>
            <h1>2hrs</h1>
            <p>Last Week - 2hrs</p>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
