<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Dashboard</title>
  <link rel="stylesheet" href="./cards.css">
</head>
<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="sidebar">
    <div class="profile">
      <img src="image-jeremy.png" alt="profile">
      <p>Report for</p>
      <h2>Jeremy Robson</h2>
    </div>

    <div class="menu">
      <p>Daily</p>
      <p class="active">Weekly</p>
      <p>Monthly</p>
    </div>
  </div>

  <!-- RIGHT CARDS -->
  <div class="cards">

    <div class="card work">
      <h4>Work</h4>
      <h1>38hrs</h1>
      <p>Last Week - 36hrs</p>
    </div>

    <div class="card play">
      <h4>Play</h4>
      <h1>10hrs</h1>
      <p>Last Week - 8hrs</p>
    </div>

    <div class="card study">
      <h4>Study</h4>
      <h1>4hrs</h1>
      <p>Last Week - 7hrs</p>
    </div>

    <div class="card exercise">
      <h4>Exercise</h4>
      <h1>4hrs</h1>
      <p>Last Week - 5hrs</p>
    </div>

    <div class="card social">
      <h4>Social</h4>
      <h1>5hrs</h1>
      <p>Last Week - 10hrs</p>
    </div>

    <div class="card selfcare">
      <h4>Self Care</h4>
      <h1>2hrs</h1>
      <p>Last Week - 2hrs</p>
    </div>

  </div>

</div>

</body>
</html>
